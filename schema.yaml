    tags:
      -
        name: d
        next:
          type: free
          required: true
      -
        name: e
        next:
          type: id
          required: true
          next:
            type: relay
      -
        name: a
        next:
          type: addr
          required: true
          next:
            type: relay
      -
        name: i
        next:
          type: free
          required: true
      -
        name: k
        next:
          type: free
      -
        name: A
        next:
          type: addr
          required: true
      - *titletag
      - name: t
        next:
          type: lowercase

