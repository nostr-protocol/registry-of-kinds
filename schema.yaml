      - name: license
        next:
          type: free
      - name: sticker
        next:
          type: free
          required: true
          next:
            type: url
            required: true
            next:
              type: hex
              required: true
              next:
                type: free
                required: true
                next:
                  type: free
                  next:
                    type: free
                    next:
                      type: free
        description: shortcode, url, sha256, mime, optional dim, optional alt, optional emoji
