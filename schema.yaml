  30828:
    description: Timeline Card
    summary: "Addressable timeline card in schema’s project-specific calendar/timeline model. Content is Djot; required `event_date`, corpus/topics, label namespace/value, optional event time, locations and fork/adopt source references control indexing and provenance."
    in_use: true
    content:
      type: free
      # djot; a card carrying no text at all is valid
    required:
      - event_date
      - L
      - l
    multiple:
      - t
      - L
      - l
      - g
      - a
      - e
      - p
    tags:
      -
        name: event_date
        next:
          type: date
          required: true
        description: the date the card is about, YYYY-MM-DD; distinct from created_at
      -
        name: t
        next:
          type: lowercase
          required: true
        description: corpus discovery marker, and freeform topics; a client configured for a corpus admits cards wearing its marker
      -
        name: L
        next:
          type: free
          required: true
        description: label namespace; timeline.collection, timeline.date, timeline.location, ISO-3166-1, ISO-3166-2
      -
        name: l
        next:
          type: free
          required: true
          next:
            type: free
            required: true
        description: label value and its namespace; exactly one timeline.collection label, plus date buckets and an optional jurisdiction ladder
      -
        name: event_time
        next:
          type: free
          required: true
        description: time of day refining event_date, HH:MM or HH:MM:SS; bare is UTC, a trailing ±HH:MM offset marks local civil time
      - *titletag
      - *summarytag
      - *publishedattag
      - *gtag
      -
        name: a
        next:
          type: addr
          required: true
          next:
            type: free
            next:
              type: constrained
              either:
                - fork
                - adopt
        description: source card, with the marker in the fourth position; fork = built from it, adopt = carried verbatim (at most one adopt)
      -
        name: e
        next:
          type: id
          required: true
          next:
            type: free
            next:
              type: constrained
              either:
                - fork
                - adopt
        description: the exact source version, a commitment never dereferenced
      -
        name: p
        next:
          type: pubkey
          required: true
          next:
            type: free
            next:
              type: constrained
              either:
                - fork
                - adopt
        description: the source's author, for credit; same marker as the a and e it accompanies

