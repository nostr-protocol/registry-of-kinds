  30040:
    description: Curated Publication Index
    summary: "NKBIP-01 addressable publication index: ordered, optionally nested table of contents for books, magazines, reading lists or documentation. MUST have empty content, normalized `d`, `title`, ordered `a` references, and `auto-update` policy (`yes`/`ask`/`no`)."
