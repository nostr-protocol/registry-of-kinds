_profile: &profile
  type: pubkey
  required: true
  next:
    type: relay
    next:
      type: free  # petname

_external: &external
  type: free
  required: true
  next:
    type: url

_event: &event
  type: id
  required: true
  next:
    type: relay
    next:
      type: pubkey

_addr: &addr
  type: addr
  required: true
  next:
    type: relay

_kind: &kind
  type: kind
  required: true

_nip73k: &nip73k
  required: true
  type: constrained
  either:
   - web
   - isbn
   - geo
   - iso3166
   - isan
   - doi
   - '#'
   - podcast:guid 
   - podcast:item:guid
   - podcast:publisher:guid
   - bitcoin:tx
   - bitcoin:address
   - ethereum:tx
   - ethereum:address

_rtag: &rtag
  name: r
  next:
    type: url
    required: true

_relaytag: &relaytag
  name: relay
  next:
    type: relay
    required: true

_imetatag: &imetatag
  name: imeta
  next:
    type: imeta
    required: true
    variadic: true
  description: metadata about media items present in the event, each tag item is a space-separated key-value pair

_emojitag: &emojitag
  name: emoji
  next:
    type: free
    required: true
    next:
      type: url
      required: true
  description: emojis references used inside the .content

_title: &titletag
  name: title
  next:
    type: free

_image: &imagetag
  name: image
  next:
    type: url
    required: true

_description: &descriptiontag
  name: description
  next:
    type: free
    required: true

_summary: &summarytag
  name: summary
  next:
    type: free
    required: true

_publishedattag: &publishedattag
  name: published_at
  next:
    type: timestamp
    required: true
  description: when an event is replaced, the stringified timestamp of the original event

_atag: &atag
  name: a
  next: *addr

_ptag: &ptag
  name: p
  next: *profile

_etag: &etag
  name: e
  next: *event

_qtag: &qtag
  name: q
  next: *event

_ktag: &ktag
  name: k
  next: *kind
  description: kind of the event being replied to or referenced

_gtag: &gtag
  name: g
  next:
    type: geohash
    required: true

_servertag: &servertag
  name: server
  next:
    type: url
    required: true

_pathtag: &pathtag
  name: path
  next:
    type: free
    required: true
    next:
      type: hex
      required: true

_sourcetag: &sourcetag
  name: source
  next:
    type: url
    required: true

_ptag-bare: &ptag-bare
  name: p
  next:
    type: pubkey
    required: true

_etag-bare: &etag-bare
  name: e
  next:
    type: id
    required: true

_atag-bare: &atag-bare
  name: a
  next:
    type: addr
    required: true

generic_tags:
  t:
    type: lowercase
    required: true
  L:
    type: free
    required: true
  l:
    type: lowercase
    required: true
    next:
      type: free
      required: true
  expiration:
    type: timestamp
    required: true
  h:
    type: free
    required: true

kinds:
  0:
    description: User Metadata
    in_use: true
    content:
      type: json
    multiple:
      - emoji
    tags:
      - *emojitag

  1:
    description: Short Text Note
    in_use: true
    content:
      type: free
    multiple:
      - e
      - q
      - p
      - a
      - emoji
      - imeta
    tags:
      -
        name: e
        next:
          type: id
          required: true
          next:
            type: relay
            next:
              type: constrained
              either:
               - reply
               - root
              next:
                type: pubkey
      -
        name: q
        next:
          type: id
          required: true
          next:
            type: relay
            next:
              type: pubkey
        description: quoted event
      -
        name: q
        next:
          type: addr
          required: true
          next:
            type: relay
        description: quoted address
      -
        name: p
        next: *profile
      -
        name: a
        next: *addr
      -
        name: subject
        next:
          type: free
          required: true
      - *emojitag
      - *imetatag

  3:
    description: Follows
    in_use: true
    content:
      type: free
    multiple:
      - p
    tags:
      - *ptag

  4:
    description: Encrypted Direct Messages
    summary: "Legacy encrypted one-to-one DM. Event content is AES-256-CBC ciphertext plus base64 IV; `p` identifies recipient."
    content:
      type: free
    tags:
      - *ptag

  5:
    description: Event Deletion Request
    summary: "Author asks relays and clients to delete/hide their own events. `e` targets regular events, `a` targets replaceable/addressable coordinates, and `k` identifies target kind; content may explain reason. Concord also uses kind 5 as an in-stream semantic deletion rumor, with `channel`/`epoch`/`ms` binding."
    in_use: true
    content:
      type: free
    multiple:
      - e
      - a
    tags:
      - *etag-bare
      - *atag-bare
      - *ktag
      - name: channel
        next:
          type: hex
          min: 64
          max: 64
      - name: epoch
        next:
          type: free
      - name: ms
        next:
          type: free

  6:
    description: Repost
    summary: "Reshares a kind-1 text note to the author’s followers. Content is usually stringified JSON of reposted note (may be empty); `e` points to note and should carry relay hint; `p` points to original author."
    in_use: true
    content:
      type: json
    multiple:
      - p
    tags:
      - *etag
      - *ptag

  7:
    description: Reaction
    summary: "Reacts to native Nostr event. Content `+` or empty means like/upvote; `-` means dislike/downvote; emoji means emoji reaction. As a rumor inside NIP-17 wraps it may carry `e`/`p` targeting the parent; under NIP-171 groups it also carries `h`/`epoch`/`invited_at`/`invitation_proof` group tags."
    in_use: true
    content:
      type: free
    tags:
      - *etag
      - *ptag
      - *ktag
      - *emojitag
      - name: channel
        next:
          type: hex
          min: 64
          max: 64
      - name: epoch
        next:
          type: free
      - name: ms
        next:
          type: free
      - name: h
        next:
          type: hex
          min: 64
          max: 64
      - name: invited_at
        next:
          type: timestamp
      - name: invitation_proof
        next:
          type: hex
          min: 128
          max: 128

  8:
    description: Badge Award
    summary: "Badge issuer awards a NIP-58 badge defined by kind 30009. One `a` tag references badge definition; one or more `p` tags name recipients."
    in_use: true
    content:
      type: empty
    tags:
      - *atag
      - *ptag

  9:
    description: Chat Message
    summary: "Chat message, used mainly by NIP-29. Also used as Concord encrypted-channel message rumor. Concord binds it to `channel` and `epoch`, adds `ms` for sub-second ordering, and uses `q` for inline quotes; outer kind-1059 stream wrap hides it."
    in_use: true
    content:
      type: free
    multiple:
      - e
      - p
      - q
    tags:
      -
        name: e
        next:
          type: id
          required: true
          next:
            type: relay
            next:
              type: constrained
              either:
               - root
              next:
                type: pubkey
      -
        name: q
        next:
          type: id
          required: true
          next:
            type: relay
            next:
              type: pubkey
      -
        name: q
        next:
          type: addr
          required: true
          next:
            type: relay
      - *ptag
      - name: channel
        next:
          type: hex
          min: 64
          max: 64
      - name: epoch
        next:
          type: free
      - name: ms
        next:
          type: free

  11:
    description: Forum Thread
    summary: "Creates public forum topic/thread; `title` is recommended, content carries opening post. Replies should be kind-1111 comments linked to root rather than nested kind-11 events."
    in_use: true
    content:
      type: free
    multiple:
      - p
      - q
    tags:
      - *titletag
      - *ptag
      - *qtag

  13:
    description: Seal
    summary: "NIP-59 encrypted envelope holding signed inner rumor. Seal is encrypted to recipient with NIP-44, signed by real author, and deliberately omits recipient `p` tag; public observer sees signer but not recipient or message."
    in_use: true
    content:
      type: free
    tags: []

  14:
    description: Direct Message
    summary: "Plaintext “rumor” message payload for encrypted NIP-17 chats. `p` tags identify recipients; `e` may identify direct parent; `subject` names conversation. Normally unsigned, sealed as kind 13 and gift-wrapped as kind 1059 per recipient. Under NIP-171 groups, single `p` names the epoch pubkey, `h` the group identity pubkey, and `invited_at`/`invitation_proof` carry the sender's epoch ticket; group-identity announcements use `member` tags and content `+`/`-`."
    in_use: true
    content:
      type: free
    multiple:
      - p
      - q
      - member
    tags:
      - *ptag
      - *etag
      - *qtag
      -
        name: member
        next:
          type: pubkey
          required: true
      -
        name: subject
        next:
          type: free
          required: true
      -
        name: h
        next:
          type: hex
          min: 64
          max: 64
      -
        name: epoch
        next:
          type: free
      -
        name: invited_at
        next:
          type: timestamp
      -
        name: invitation_proof
        next:
          type: hex
          min: 128
          max: 128

  15:
    description: File Message
    summary: "NIP-17 private-chat file attachment rumor. Content is the encrypted file URL; required tags carry recipient(s), MIME type, encryption algorithm/key/nonce and SHA-256 of encrypted file (`x`). Optional `ox`, size, dimensions, thumbhash/blurhash, thumbnail and fallback URLs describe original file or previews. Under NIP-171 groups it additionally carries `h`/`epoch`/`invited_at`/`invitation_proof`."
    in_use: true
    content:
      type: url
    required:
      - p
      - file-type
      - encryption-algorithm
      - decryption-key
      - decryption-nonce
      - x
    multiple:
      - p
      - fallback
    tags:
      - *ptag
      -
        name: e
        next:
          type: id
          required: true
          next:
            type: relay
            next:
              type: constrained
              either:
               - reply
      -
        name: subject
        next:
          type: free
          required: true
      -
        name: file-type
        next:
          type: free
          required: true
      -
        name: encryption-algorithm
        next:
          type: constrained
          either:
            - aes-gcm
          required: true
      -
        name: decryption-key
        next:
          type: free
          required: true
      -
        name: decryption-nonce
        next:
          type: free
          required: true
      -
        name: x
        next:
          type: hex
          min: 64
          max: 64
          required: true
      -
        name: ox
        next:
          type: hex
          min: 64
          max: 64
      -
        name: size
        next:
          type: free
      -
        name: dim
        next:
          type: free
      -
        name: thumbhash
        next:
          type: free
      -
        name: blurhash
        next:
          type: free
      -
        name: thumb
        next:
          type: url
      -
        name: fallback
        next:
          type: url
      -
        name: h
        next:
          type: hex
          min: 64
          max: 64
      -
        name: epoch
        next:
          type: free
      -
        name: invited_at
        next:
          type: timestamp
      -
        name: invitation_proof
        next:
          type: hex
          min: 128
          max: 128

  16:
    description: Generic Repost
    summary: "Repost of any event kind other than kind 1. Usually has `e`, `p`, and `k` tags; addressable reposts should include `a`."
    in_use: true
    content:
      type: json
    tags:
      - *etag
      - *ptag
      - *ktag

  17:
    description: Reaction to a Website
    summary: "Reaction to non-Nostr resources, unlike kind 7. NIP-73 `k` names identifier scheme (`web`, podcast GUID, Bitcoin, etc.) and `i` carries external identifier/URL; content is reaction value."
    content:
      type: free
    required:
      - r
    tags:
      - *rtag

  20:
    description: Photo
    summary: "NIP-68 Picture event. User-facing image/photo post: event text is caption; one or more `imeta` tags describe media URL, MIME, hash/dimensions and optional alt/blurhash; tags can add title, warning, author mentions and location/geohash."
    in_use: true
    content:
      type: free
    required:
      - imeta
    multiple:
      - p
      - g
    tags:
      - *titletag
      - *imetatag
      -
        name: content-warning
        next:
          type: free
          required: true
      - *ptag
      -
        name: m
        next:
          type: constrained
          either:
           - image/apng
           - image/avif
           - image/gif
           - image/jpeg
           - image/png
           - image/webp
          required: true
      -
        name: x
        next:
          type: hex
          min: 64
          max: 64
          required: true
      -
        name: location
        next:
          type: free
          required: true
      - *gtag

  21:
    description: Normal Video Event
    summary: "NIP-71 addressable video post in horizontal/normal format. Caption in content; `imeta` carries video/poster URLs and metadata; title, published time, content warning, segments, text tracks, people and source URL are optional."
    in_use: true
    content:
      type: free
    required:
      - imeta
    multiple:
      - p
    tags:
      - *titletag
      - *publishedattag
      - *imetatag
      -
        name: content-warning
        next:
          type: free
          required: true
      -
        name: segment
        next:
          type: free
          required: true
          next:
            type: free
            required: true
            next:
              type: free
              required: true
              next:
                type: url
      - *ptag
      - *rtag
      -
        name: text-track
        next:
          type: json
          required: true
          next:
            type: relay

  22:
    description: Short Video Event
    summary: "NIP-71 addressable short-video post, intended for vertical/short-form video. Content carries caption; `imeta` describes media items; title, publication time, warnings, segments and text tracks add presentation metadata."
    in_use: true
    content:
      type: free
    required:
      - imeta
    multiple:
      - p
    tags:
      - *titletag
      - *publishedattag
      - *imetatag
      -
        name: content-warning
        next:
          type: free
          required: true
      -
        name: segment
        next:
          type: free
          required: true
          next:
            type: free
            required: true
            next:
              type: free
              required: true
              next:
                type: url
      - *ptag
      - *rtag
      -
        name: text-track
        next:
          type: json
          required: true
          next:
            type: relay

  24:
    description: Public Message
    summary: "Public-message rumor used by NIP-17 message conventions; unlike kind 14 DM, this is intended for public messaging. Schema requires one or more recipient/participant `p` tags and allows quoted events (`q`) and media metadata (`imeta`)."
    in_use: true
    content:
      type: free
    required:
      - p
    multiple:
      - q
      - imeta
    tags:
      - *ptag
      - *qtag
      - *imetatag

  30:
    description: Jester Chess Event
    summary: "Jester UI uses kind 30 for its own JSON chess-game protocol, separate from kind 64 PGN. Start events anchor to an `e` hash of initial FEN; move events reference game-start and prior-move event IDs."
    content:
      type: json
    multiple:
      - e
      - p
    tags:
      - *etag
      - *ptag

  40:
    description: Channel Creation
    summary: "Creates public chat channel under legacy NIP-28. Content is JSON channel metadata (`name`, `about`, `picture`, relays); event ID anchors later kind-41 metadata and kind-42 messages."
    content:
      type: json
    tags: []

  41:
    description: Channel Metadata
    summary: "Updates metadata for kind-40 channel without changing its ID. Content is JSON; an `e` tag identifies root channel event."
    content:
      type: json
    tags:
      -
        name: e
        next:
          type: id
          required: true
          next:
            type: relay
            next:
              type: constrained
              either:
               - root

  42:
    description: Channel Message
    summary: "Public message in NIP-28 channel. `e` tags identify root channel and optionally reply; `p` tags identify reply participants. Content is plain text."
    content:
      type: free
    tags:
      -
        name: e
        next:
          type: id
          required: true
          next:
            type: relay
            next:
              type: constrained
              either:
               - root
               - reply
      - *ptag

  43:
    description: Channel Hide Message
    summary: "Client-side moderation event saying author no longer wants to see a kind-42 message. `e` points to hidden message; JSON content may explain reason. Clients may use one user’s hide only locally or aggregate multiple hides by policy."
    content:
      type: json
    tags:
      -
        name: e
        next:
          type: id
          required: true

  44:
    description: Channel Mute User
    summary: "Client-side moderation event saying author no longer wants to see a user’s kind-42 channel messages. `p` identifies muted user; optional JSON content may state reason. Clients choose whether to apply only for author or aggregate moderation."
    content:
      type: json
    tags:
      - *ptag

  54:
    description: Podcast Episode
    summary: "NIP-F4 podcast episode event, authored by podcast's own pubkey. Tags describe title, optional image, description, and repeated `audio` URL plus optional media type; content is Markdown show notes."
    in_use: true
    content:
      type: free
    multiple:
      - audio
    tags:
      - *titletag
      - *imagetag
      - *descriptiontag
      -
        name: audio
        next:
          type: url
          required: true
          next:
            type: free

  62:
    description: Request to Vanish
    summary: "NIP-62 event asks relays to remove all events by signing pubkey. Relay list can be constrained with `relay` tags; no content needed."
    content:
      type: free
    multiple:
      - relay
    tags:
      - *relaytag

  64:
    description: Chess (PGN)
    summary: "Chess game record expressed as PGN text; schema permits opponent `p` tag. Intended for publishing replayable chess games, with content carrying portable game notation rather than chat-style moves."
    content:
      type: free
    tags:
      - *ptag

  78:
    description: Application Data
    summary: "NIP-78 replaceable application-specific user data. `d` tag groups an app’s data records; content is app-defined, and relays should protect it with AUTH and serve only owner. Use kind 30078 for addressable records where multiple named records are needed."
    content:
      type: free
    tags:
      - name: d
        next:
          type: free
          required: true
        description: grouping key

  82:
    description: Medical Data (FHIR)
    summary: "Schema reserves kind 82 for healthcare data using FHIR-style content. No canonical kind-82 NIP or source repository confirmed in current NIPs tree; event may contain sensitive health data, so inspect intended encryption/access-control scheme before handling."
    content:
      type: free
    tags: []

  777:
    description: Spell
    summary: "Schema models a NIP-55-style “spell”: a signed query instruction (`cmd=REQ`) with kinds, IDs, authors, tags, relay list, name and optional close-on-EOSE. It serializes a reusable relay request, not user-post content."
    content:
      type: free
    in_use: true
    required:
      - cmd
    multiple:
      - tag
    tags:
      -
        name: name
        next:
          type: free
          required: true
      -
        name: cmd
        next:
          type: constrained
          either:
           - REQ
          required: true
      -
        name: k
        next:
          type: kind
          required: true
          variadic: true
      -
        name: ids
        next:
          type: id
          required: true
          variadic: true
      -
        name: authors
        next:
          type: free
          required: true
          variadic: true
      -
        name: tag
        next:
          type: free
          required: true
          next:
            type: free
            required: true
            variadic: true
      -
        name: relays
        next:
          type: relay
          variadic: true
          required: true
      -
        name: close-on-eose

  818:
    description: Wiki Merge Requests
    summary: "Schema identifies a wiki merge request referencing target address (`a`), people, and events. This is a project-level request to merge wiki edits, distinct from NIP-34 Git pull requests (kinds 1618/1619)."
    in_use: true
    content:
      type: free
    tags:
      - *atag
      - *ptag
      - *etag

  1010:
    description: Text Note Edit
    summary: "Schema describes an edit event referring to original event ID (`e`) and author (`p`), with `summary`; content carries edited text. No canonical current NIP source confirmed; beware interoperability ambiguity with replaceable notes and deletion/repost patterns."
    content:
      type: free
    tags:
      - *etag-bare
      - *ptag-bare
      - name: summary
        next:
          type: free
          required: true

  1014:
    description: Epoch Ticket
    summary: "NIP-171 private group invitation. Group identity key signs ticket naming member (`p`) and epoch number (`epoch`); content is the 32-byte hex epoch private key. Delivered wrapped to the member; receivers rebuild the ticket from message proof tags and verify the signature."
    in_use: true
    content:
      type: hex
      min: 64
      max: 64
    required:
      - p
      - epoch
    tags:
      -
        name: p
        next:
          type: pubkey
          required: true
      -
        name: epoch
        next:
          type: free
          required: true

  1018:
    description: Poll Response
    summary: "Schema: empty-content response linked to poll via `e`, with required `response` tag. Likely one user’s answer to a poll, but poll/answer cardinality and edit rules need source confirmation; NIP-88 kind 1068 defines the newer poll event."
    in_use: true
    content:
      type: empty
    tags:
      - *etag
      -
        name: response
        next:
          type: free
          required: true

  1021:
    description: Bid
    summary: "Schema labels event “Bid”; free-form content and `e` target. Likely marketplace bid tied to auction event, but no authoritative spec or tag grammar confirmed."
    content:
      type: free
    tags:
      - *etag

  1022:
    description: Bid Confirmation
    summary: "Schema labels JSON event “Bid Confirmation”, linked with `e`. Likely confirms bid acceptance/state in a marketplace auction flow; issuer, trust model and JSON schema are not specified here."
    content:
      type: json
    tags:
      - *etag

  1040:
    description: OpenTimestamps
    summary: "Schema labels this kind for OpenTimestamps data, linked to timestamped target by `e` and categorized with `k`. Used to attach proof/attestation that event content existed by a given time; proof format is not described in schema."
    in_use: false
    content:
      type: free
    tags:
      - *etag
      - *ktag

  1222:
    description: Voice Message
    summary: "NIP-A0 root voice message, generally a short audio clip (recommended ≤60 seconds). Content MUST be direct audio URL; `audio/mp4` with AAC/Opus recommended."
    in_use: true
    content:
      type: free
    multiple:
      - p
    tags:
      - *ptag

  1227:
    description: Scroll
    summary: "Schema’s addressable “Scroll” definition describes an application/navigation surface with `name`, `description`, `icon`, and repeatable `param` declarations. Params define types such as public key, event, string, number, timestamp or relay, plus requiredness and optional free-form details."
    in_use: true
    content:
      type: free
    multiple:
      - param
    tags:
      -
        name: name
        next:
          type: free
          required: true
      - *descriptiontag
      -
        name: icon
        next:
          type: url
          required: true
      -
        name: param
        next:
          type: free
          required: true
          next:
            type: free
            required: true
            next:
              type: constrained
              either:
               - public_key
               - event
               - string
               - number
               - timestamp
               - relay
              required: true
              next:
                type: constrained
                either:
                 - required
                next:
                  type: free

  15128:
    description: Root Nsite
    summary: "NIP-5A root-site manifest: one replaceable event per author; MUST NOT include `d`. One or more `path` tags map absolute paths to SHA-256 blob hashes (`['path','/absolute/path','sha256']`); `x` aggregate hash is recommended but optional. `server`, title, description, source, icon and app references are optional."
    in_use: true
    content:
      type: empty
    multiple:
      - path
      - server
    required:
      - path
    tags:
      - *pathtag
      - *servertag
      - *titletag
      - *descriptiontag
      - *sourcetag

  1244:
    description: Voice Message Comment
    summary: "NIP-A0 voice-message reply. Uses NIP-22 kind-1111 root/parent references, but content itself MUST be direct audio URL (not ordinary prose); ≤60 seconds recommended, `audio/mp4` preferred."
    in_use: true
    content:
      type: free
    required:
      - p
    multiple:
      - p
    tags:
      -
        name: A
        next: *addr
      -
        name: a
        next: *addr
      -
        name: E
        next: *event
      -
        name: e
        next: *event
      -
        name: I
        next: *external
      -
        name: i
        next: *external
      -
        name: K
        next: *kind
      -
        name: K
        next: *nip73k
      - *ktag
      -
        name: P
        next: *profile
      - *ptag

  1311:
    description: Live Chat Message
    summary: "Chat message attached to live event/stream. Schema lists no tags; event likely belongs to NIP-53 live activities where kind 1311 is chat during a live event, with stream association convention supplied outside this minimal schema."
    in_use: true
    content:
      type: free
    tags: []

  1337:
    description: Code Snippet
    summary: "Code-snippet event. Content contains snippet text; tags can label language, filename/name, extension, runtime, license, repeatable dependencies, repository and description."
    in_use: true
    content:
      type: free
    tags:
      -
        name: l
        next:
          type: lowercase
          required: true
        description: programming language name
      -
        name: name
        next:
          type: free
          required: true
        description: snippet name or filename
      -
        name: extension
        next:
          type: free
          required: true
        description: file extension without dot
      - *descriptiontag
      -
        name: runtime
        next:
          type: free
          required: true
        description: runtime or environment specification
      -
        name: license
        next:
          type: free
          required: true
          next:
            type: url
        description: SPDX license identifier, repeatable
      -
        name: dep
        next:
          type: free
          required: true
        description: dependency, repeatable
      -
        name: repo
        next:
          type: free
          required: true
          next:
            type: relay
        description: repository URL or NIP-34 address

  1971:
    description: Problem Tracker
    summary: "Registry names kind 1971 “Problem Tracker” (historical Nostrocket mapping), but current Nostrocket NIP-1971 draft uses **kind 31971** for addressable problem snapshots. Problems form revision and parent DAGs; comments, claims and solutions use NIP-22 kind 1111."
    content:
      type: free
    tags: []

  1986:
    description: Relay Reviews
    summary: "Schema label indicates a relay review/rating event, with free-form content and no structured tags. Likely describes relay quality or experience; author identity and review timestamp are available from normal event envelope."
    content:
      type: free
    tags: []

  1987:
    description: AI Embeddings / Vector Lists
    summary: "NKBIP-02 draft defines kind 1987 as embedding annotation for another event. Required tags: `e` target, `model` name/version/source, `type` modality, and `vector`; optional `dims`, `norm`, model hash/hash_type and `source`."
    content:
      type: free
    tags: []

  2003:
    description: Torrent
    summary: "NIP-35 torrent index event. Publishes searchable metadata and magnet construction inputs, not torrent payload itself."
    in_use: true
    content:
      type: free
    tags:
      - *titletag
      -
        name: x
        next:
          type: free
          required: true
      -
        name: file
        next:
          type: free
          required: true
          next:
            type: free
      -
        name: tracker
        next:
          type: url
      -
        name: i
        next:
          type: free

  2004:
    description: Torrent Comment
    summary: "Comment on kind-2003 torrent listing. NIP-35 says it behaves like kind-1 text note and should follow NIP-10 reply tagging; registry schema accepts `e` reference."
    content:
      type: free
    tags:
      - *etag

  2022:
    description: Coinjoin Pool
    summary: "Registry names this “Coinjoin Pool”; schema has free-form content and no tags. Likely describes a collaborative Bitcoin transaction/pool, but no payload format, coordinator role, or security model is captured here."
    content:
      type: free
    tags: []

  4550:
    description: Community Post Approval
    summary: "NIP-72 event by community moderator approving a post for a community. Includes one or more community `a` coordinates, an `e` or `a` target post reference, and author `p` tag; clients can notify authors and use approval state for moderated feeds."
    content:
      type: free
    tags: []

  4454:
    description: Decoupled Key Client Announcement
    summary: "NIP-4e draft client-key announcement. Event is signed by user's identity pubkey; `P` is that client installation's local public key, and `client` is a human-readable client label."
    content:
      type: empty
    in_use: true
    required:
      - P
      - client
    tags:
      -
        name: P
        next:
          type: pubkey
          required: true
      -
        name: client
        next:
          type: free
          required: true

  4455:
    description: Decoupled Encryption Key Distribution
    summary: "NIP-4e draft encrypted key transfer. Identity-key-signed event addresses receiving client with `p`; `P` is sender's temporary transfer pubkey; content is NIP-44 ciphertext containing shared encryption key."
    content:
      type: free
    in_use: true
    required:
      - p
      - P
    tags:
      -
        name: p
        next:
          type: pubkey
          required: true
      -
        name: P
        next:
          type: pubkey
          required: true

  7374:
    description: Reserved Cashu Wallet Tokens
    summary: "NIP-60 replaceable wallet state event for reserved Cashu tokens. Client-wallet state intended to be encrypted/private to owner; exact records are application wallet data."
    in_use: true
    content:
      type: free
    tags: []

  7375:
    description: Cashu Wallet Tokens
    summary: "NIP-60 wallet state event stores Cashu proofs/tokens for a user’s wallet. Treat content as sensitive wallet material; implementations use NIP-44 encryption and NIP-60 wallet backup conventions rather than public profile data."
    in_use: true
    content:
      type: free
    tags: []

  7376:
    description: Cashu Wallet History
    summary: "NIP-60 wallet history event records transaction/history data for the user’s Cashu wallet, complementing token events 7374/7375. It is private user wallet state, not a public payment receipt."
    in_use: true
    content:
      type: free
    tags: []

  7516:
    description: Geocache Log
    summary: "Geocaching activity/log event referencing a cache listing; logs may capture find/not-found/notes and associated location/media. Current NIP-CC geocaching draft adds proof-verification fields; exact relationship should follow draft version."
    content:
      type: free
    tags: []

  7517:
    description: Geocache Proof of Find
    summary: "Signed geocache proof event, used to demonstrate physical presence at a cache. NIP-CC describes cache verification keys and embedding/reference of proof within kind-7516 found logs; proof validity depends on cache configuration."
    content:
      type: free
    tags: []

  9321:
    description: Nutzap
    summary: "NIP-61 Cashu ecash zap event. Proof(s) and mint URL identify ecash payment; `e`, `k`, `p` can bind zap to target event kind/author."
    in_use: true
    content:
      type: free
    tags:
      -
        name: proof
        next:
          type: free
          required: true
          variadic: true
      -
        name: u
        next:
          type: url
          required: true
      - *etag-bare
      - *ktag
      - *ptag

  9467:
    description: Tidal Login
    summary: "Schema label “Tidal Login”; free-form content with no tags. Likely app-specific login/session exchange for Tidal integration, but exact account binding, secrets and lifecycle not available in registry."
    content:
      type: free
    tags: []

  1059:
    description: Gift Wrap
    summary: "Outer encrypted wrapper. Standard NIP-59 uses ephemeral author and recipient `p`; Concord CORD-01 stream wraps reverse this (fixed derived stream author, random ephemeral `p`) and contain kind-20013/20014 seal. Optional `k` indexes direct invites."
    in_use: true
    content:
      type: free
    tags:
      - *ptag
      - *ktag

  1063:
    description: File Metadata
    summary: "NIP-94 file metadata event describes an external file for discovery/sharing. Tags provide URL, MIME, hash, original hash, size, dimensions, magnet/info, blurhash, thumbnail, image/summary/fallback/service data; content can be caption/context."
    content:
      type: free
    tags:
      -
        name: url
        next:
          type: url
          required: true
      -
        name: m
        next:
          type: free
          required: true
      -
        name: x
        next:
          type: free
          required: true
      -
        name: ox
        next:
          type: free
          required: true
      -
        name: size
        next:
          type: free
          required: true
      -
        name: dim
        next:
          type: free
          required: true
      -
        name: magnet
        next:
          type: url
          required: true
      -
        name: i
        next:
          type: free
          required: true
      -
        name: blurhash
        next:
          type: free
          required: true
      -
        name: thumb
        next:
          type: url
          required: true
      - *imagetag
      - *summarytag
      -
        name: fallback
        next:
          type: url
          required: true
      -
        name: service
        next:
          type: free
          required: true

  1064:
    description: Blob Data (NIP-95)
    summary: "NIP-95 embedded blob event stores file bytes in event content (base64-encoded binary) for relay-hosted file delivery. Schema’s free-form type reflects encoded payload rather than prose."
    content:
      type: free
    tags: []

  1065:
    description: Blob Header (NIP-95)
    summary: "NIP-95 metadata/header for an embedded blob. `e` references kind-1064 blob; MIME type, SHA-256 hash and size describe data so clients can validate and handle it."
    content:
      type: free
    tags:
      - *etag
      -
        name: m
        next:
          type: free
          required: true
      -
        name: x
        next:
          type: free
          required: true
      -
        name: size
        next:
          type: free
          required: true

  1068:
    description: Poll
    summary: "NIP-88 poll event. Content provides question/context; repeated `option` tags provide option IDs and labels; `polltype` sets single/multiple choice, `endsAt` gives close time, optional relay tags direct answer submissions."
    in_use: true
    content:
      type: free
    required:
      - option
    multiple:
      - option
    tags:
      -
        name: option
        next:
          type: free
          required: true
          next:
            type: free
            required: true
      - *relaytag
      -
        name: polltype
        next:
          type: constrained
          either:
           - singlechoice
           - multiplechoice
      -
        name: endsAt
        next:
          type: free
          required: true

  1073:
    description: Music Track Scrobble
    summary: "Scrobble/listening record: empty content; tags record title, album, repeatable artist, and external track identifier such as Spotify track ID or ISRC. Intended to publish a user’s listening activity."
    in_use: true
    content:
      type: empty
    multiple:
      - artist
      - i
    tags:
      -
        name: title
        next:
          type: free
          required: true
        description: track title
      -
        name: album
        next:
          type: free
          required: true
      -
        name: artist
        next:
          type: free
          required: true
        description: artist name, repeatable
      -
        name: i
        next:
          type: free
          required: true
        description: external identifier, e.g. spotify:track:<id> or isrc:<ISRC>

  1621:
    description: Git Issue
    summary: "NIP-34 Git issue event. Addressable repo reference (`a`) and required `subject` identify issue; `p` may identify participants."
    content:
      type: free
    required:
      - subject
      - a
    tags:
      - *atag
      - *ptag
      -
        name: subject
        next:
          type: free
          required: true

  1630:
    description: Git Issue Status Open
    summary: "NIP-34 status event marks a Git issue open and references issue event (`e`) plus repo/participant tags. It is a status transition event rather than editing original issue content."
    content:
      type: free
    required:
      - e
      - p
    multiple:
      - p
      - e
    tags:
      - *ptag
      - *etag

  1631:
    description: Git Issue Applied/Merged/Resolved
    summary: "NIP-34 status event records that referenced issue is resolved by applied/merged patch. Schema supports `q` patch event, merge commit hash and applied-as-commits hashes in addition to issue `e`/participant tags."
    content:
      type: free
    required:
      - e
      - p
    multiple:
      - p
      - e
    tags:
      - *ptag
      - *etag
      -
        name: q
        next: *event
        description: applied or merged patch event id
      -
        name: merge-commit
        next:
          type: hex
          min: 64
          max: 64
          required: true
      -
        name: applied-as-commits
        next:
          type: hex
          min: 64
          max: 64
          required: true

  1632:
    description: Git Issue Status Closed
    summary: "NIP-34 status event marks referenced Git issue closed without the schema’s applied/merged metadata. `e` identifies issue, `p` may identify involved people."
    content:
      type: free
    required:
      - e
      - p
    multiple:
      - p
      - e
    tags:
      - *ptag
      - *etag

  1633:
    description: Git Issue Status Draft
    summary: "NIP-34 status event marks Git issue as draft; `e` references issue and `p` can identify participants. Distinct status kind helps repository clients filter issue lifecycle."
    content:
      type: free
    required:
      - e
      - p
    multiple:
      - p
      - e
    tags:
      - *ptag
      - *etag

  1984:
    description: Reporting
    summary: "NIP-56 report event flags pubkey (`p`), event (`e`) or addressable event (`a`) as objectionable. Content may state report reason; `l` label and `L` namespace tags can classify."
    in_use: true
    content:
      type: free
    tags:
      - *ptag
      - *etag
      - *atag

  1985:
    description: Label
    summary: "NIP-32 label event associates machine-readable labels with events, users, or addresses. Labels use `L` namespace and `l` value; `e`, `p`, and `a` identify subjects."
    content:
      type: free
    tags:
      - *ptag
      - *etag
      - *atag

  19004:
    description: Room Creation Permission
    summary: "Replaceable permission grant (flotilla, alongside NIP-29) listing pubkeys allowed to create rooms on the relay that publishes it. `p` tags carry the granted pubkeys with an optional role. Relay-signed; clients query by `#p` to decide whether to offer room creation."
    in_use: true
    content:
      type: empty
    multiple:
      - p
    tags:
      -
        name: p
        next:
          type: pubkey
          required: true
          next:
            type: free
            variadic: true

  9041:
    description: Zap Goal
    summary: "NIP-75 addressable goal/crowdfunding target. Tags describe amount, accepted relays, close time, artwork/summary, target event/address, and zap service pubkey/relay/config."
    content:
      type: free
    tags:
      -
        name: amount
        next:
          type: free
          required: true
      -
        name: relays
        next:
          type: relay
          variadic: true
          required: true
      -
        name: closed_at
        next:
          type: free
      - *imagetag
      - *summarytag
      - *rtag
      - *atag
      -
        name: zap
        next:
          type: pubkey
          required: true
          next:
            type: relay
            next:
              type: free

  9734:
    description: Zap Request
    summary: "NIP-57 unsigned/embedded zap request. Identifies recipient with `p`, optional target event/address with `e`/`a`, target kind with `k`, amount/LNURL metadata and relays for invoice-service callback."
    in_use: true
    content:
      type: free
    tags:
      -
        name: relays
        next:
          type: relay
          variadic: true
          required: true
      -
        name: amount
        next:
          type: free
      -
        name: lnurl
        next:
          type: free
      - *ptag
      - *etag
      - *atag
      - *ktag

  9735:
    description: Zap
    summary: "NIP-57 zap receipt published by Lightning service after successful payment. Event content empty; tags include recipient, optional target, invoice (`bolt11`), zap request JSON (`description`) and optional preimage."
    in_use: true
    content:
      type: empty
    tags:
      - *ptag
      -
        name: P
        next: *profile
      - *etag
      - *ktag
      -
        name: bolt11
        next:
          type: free
          required: true
      -
        name: description
        next:
          type: json
          required: true
      -
        name: preimage
        next:
          type: free

  1111:
    description: Comment
    summary: "NIP-22 generic comment/reply, also Concord threaded reply rumor. Uppercase `K/E/P` mark immutable thread root; lowercase `k/e/p` mark immediate parent. Concord additionally binds `channel`/`epoch` with `ms`; rumor ID, not outer wrap ID, is referenced."
    in_use: true
    content:
      type: free
    required:
      - p
    multiple:
      - p
    tags:
      -
        name: A
        next: *addr
        description: the root of the thread, if it is an addressable event
      - *atag
      -
        name: E
        next: *event
        description: the root of the thread, if it is a normal event
      - *etag
      -
        name: I
        next: *external
        description: the root of the thread, if it is an external reference
      -
        name: K
        next: *kind
        description: kind of the thread root
      -
        name: K
        next: *nip73k
      - *ktag
      -
        name: P
        next: *profile
        description: author of the original event
      - *ptag
      - *emojitag
      - name: channel
        next:
          type: hex
          min: 64
          max: 64
      - name: epoch
        next:
          type: free
      - name: ms
        next:
          type: free

  10002:
    description: Relay List Metadata
    in_use: true
    content:
      type: empty
    multiple:
      - r
    tags:
      -
        name: r
        next:
          type: relay
          required: true
          next:
            type: constrained
            either:
             - read
             - write

  9802:
    description: Highlights
    summary: "NIP-84 highlight/bookmark quote. Content carries selected quotation; `e`/`a` or `r` point to source, `context` gives surrounding text, `comment` adds author’s note, and `p` can identify source author."
    in_use: true
    content:
      type: free
    multiple:
      - p
    tags:
      - *ptag
      - *etag
      - *atag
      - *rtag
      -
        name: context
        next:
          type: free
      -
        name: comment
        next:
          type: free

  27235:
    description: HTTP Auth
    summary: "NIP-98 HTTP authorization event. Signed event binds URL (`u`), HTTP method (`Method`) and optionally payload hash; client Base64-encodes it into `Authorization: Nostr …` header."
    in_use: true
    content:
      type: free
    tags:
      -
        name: u
        next:
          type: url
          required: true
      -
        name: Method
        next:
          type: constrained
          either:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
          required: true
      -
        name: payload
        next:
          type: free

  10000:
    description: Mute List
    summary: "NIP-51 replaceable mute list. Tags identify muted pubkeys (`p`), words (`word`), events (`e`), and potentially other supported targets."
    in_use: true
    content:
      type: free
    multiple:
      - p
      - word
    tags:
      - *ptag
      - name: word
        next:
          type: free
          required: true
      - *etag

  10001:
    description: Pin List
    summary: "NIP-51 replaceable list of events (`e`) user pins/highlights on profile. Order may matter to display; content is unused by this schema."
    in_use: true
    content:
      type: empty
    multiple:
      - e
    tags:
      - *etag

  10003:
    description: Bookmark List
    summary: "NIP-51 replaceable user bookmark list. Tags can bookmark regular events (`e`) and addressable events (`a`); private bookmark content may be encrypted by clients."
    in_use: true
    content:
      type: free
    multiple:
      - e
      - a
    tags:
      - *etag
      - *atag

  10004:
    description: Communities List
    summary: "NIP-51 user list of NIP-72 communities, referenced by address (`a`). Used to surface/organize communities a user follows or recommends; not itself community definition or membership."
    content:
      type: free
    tags:
      - *atag

  10005:
    description: Public Chats List
    summary: "NIP-51 user-curated list of public chat/channel events (`e`). Helps clients discover chat streams; channel definitions/messages are separate kinds (legacy NIP-28 groups)."
    content:
      type: free
    tags:
      - *etag

  10006:
    description: Blocked Relays List
    summary: "NIP-51 user preference list of relays to avoid, represented as `relay` tags. Clients may use it when selecting relays; it is an advisory user list, distinct from relay lists in kind 10002."
    content:
      type: free
    tags:
      - *relaytag

  10007:
    description: Search Relays List
    summary: "NIP-51 user list of relays suitable for NIP-50 search queries. Repeated `relay` tags; separates search providers from ordinary read/write relay selection."
    in_use: true
    content:
      type: free
    multiple:
      - relay
    tags:
      - *relaytag

  10012:
    description: Favorite Relays List
    summary: "NIP-51 user-selected favorite relays, using repeated `relay` tags and optionally addresses (`a`). Distinct from NIP-65 read/write relay metadata and search relay list."
    in_use: true
    content:
      type: free
    multiple:
      - relay
    tags:
      - *relaytag
      - *atag

  10015:
    description: Interests List
    summary: "NIP-51 replaceable user list of topic/interest addresses (`a` tags), primarily used for discovery and personalization. Schema permits NIP-73-style or other addressable interest references."
    in_use: true
    content:
      type: free
    tags:
      - *atag

  10020:
    description: Media Follows
    summary: "NIP-51 list of followed media creators/accounts (`p` tags), supporting a media-focused follow graph separate from general kind-3 follows."
    content:
      type: free
    multiple:
      - p
    tags:
      - *ptag

  10021:
    description: Favorite Follow Sets
    summary: "NIP-51 list of favorite follow-set addresses (`a`, typically kind 30000). Lets a user select preferred named follow lists without copying their member tags."
    in_use: true
    content:
      type: free
    multiple:
      - a
    tags:
      - *atag

  10030:
    description: User Emoji List
    summary: "NIP-51 replaceable user emoji list. `emoji` tags map shortcodes to image URLs; `a` tags can reference emoji sets. Often surfaces custom emoji to compose/rendering clients."
    in_use: true
    content:
      type: free
    multiple:
      - emoji
      - a
    tags:
      - *emojitag
      - *atag

  10031:
    description: User sticker pack list
    summary: "NIP-51 replaceable list of sticker-pack addresses (`a` tags), allowing user profile to publish favorite/available sticker packs. Pack definitions are addressable kind 30031 in this schema."
    in_use: true
    content:
      type: empty
    multiple:
      - a
    tags:
      - *atag

  10044:
    description: Decoupled Key Announcement
    summary: "Replaceable NIP-4e draft announcement of a separate NIP-44 encryption public key. The event is signed by user's identity key; required `n` tag carries encryption pubkey."
    in_use: true
    content:
      type: empty
    required:
      - n
    tags:
      -
        name: n
        next:
          type: pubkey
          required: true

  10050:
    description: Relay List to Receive DMs
    summary: "NIP-17 replaceable list of relays where author accepts private gift-wrapped messages. Recipients’ kind-10050 event is authoritative routing input; senders should not publish DMs elsewhere by default."
    in_use: true
    content:
      type: empty
    multiple:
      - relay
    tags:
      - *relaytag

  10054:
    description: Favorite Podcasts
    summary: "NIP-51-style replaceable list of podcast hosts/accounts (`p`). Supports podcast listening client’s followed/favorite show authors; show/episode metadata uses separate podcast event kinds."
    in_use: true
    content:
      type: empty
    multiple:
      - p
    tags:
      - *ptag

  10101:
    description: Good Wiki Authors
    summary: "User-curated list of trusted wiki authors (`p` tags), intended to guide wiki clients’ author trust/ranking. Complementary kind 10102 lists wiki relays."
    content:
      type: empty
    multiple:
      - p
    tags:
      - *ptag

  10102:
    description: Good Wiki Relays
    summary: "User-curated preferred wiki relays (`relay` tags). NIP-54 wiki clients can query these relays first and rank their wiki articles above results from other sources."
    content:
      type: empty
    multiple:
      - relay
    tags:
      - *relaytag

  10154:
    description: Podcast Metadata
    summary: "NIP-F4 replaceable podcast-show metadata event. `title`, `image`, and `description` identify show; optional/repeated `website` tags link web properties; `p` tags list host/cohost/editor pubkeys. Podcast listeners can read show metadata directly without treating profile kind 0 as authoritative."
    in_use: true
    content:
      type: empty
    tags:
      - *titletag
      - *imagetag
      - *descriptiontag
      -
        name: website
        next:
          type: url
          required: true
      -
        name: p
        next:
          type: pubkey
          required: true
          next:
            type: constrained
            either:
             - host
             - cohost
             - editor

  10164:
    description: Authored Podcasts
    summary: "NIP-F4 replaceable “Authored Podcasts” list. User's `p` tags identify podcast pubkeys they claim to author."
    in_use: true
    content:
      type: empty
    multiple:
      - p
    tags:
      - *ptag

  10009:
    description: User Groups
    summary: "Replaceable user list of NIP-29 groups. Repeated `group` tags encode group identifier, relay and optional metadata; allows users to publish which groups they belong to or follow."
    in_use: true
    content:
      type: empty
    multiple:
      - group
    tags:
      -
        name: group
        next:
          type: free
          required: true
          next:
            type: relay
            next:
              type: free

  10013:
    description: Private Event Relay List
    summary: "Replaceable user preference for relays used to receive private events, schema currently has no tags/content. Unlike kind 10050 (NIP-17 DM relays) this likely covers a broader privacy-oriented event category."
    content:
      type: empty
    tags: []

  10019:
    description: Nutzap Mint Recommendation
    summary: "Replaceable list of preferred Cashu mints for receiving/sending Nutzaps, with `mint` URLs and optional pubkey; relay tags may signal related relay service. Wallets use this when resolving recipient mint compatibility."
    in_use: true
    content:
      type: empty
    multiple:
      - mint
    tags:
      - *relaytag
      -
        name: mint
        next:
          type: url
          required: true
      -
        name: pubkey
        next:
          type: pubkey
          required: true

  10063:
    description: Blossom Server List
    summary: "Replaceable user list of preferred Blossom media servers (`server` URLs). Clients can use this to upload media or discover user-associated media hosts."
    in_use: true
    content:
      type: empty
    multiple:
      - server
    tags:
      -
        name: server
        next:
          type: url
          required: true

  10096:
    description: File Storage Server List
    summary: "Replaceable preference event listing file-storage server URLs. Distinct from Blossom’s kind 10063 in schema; likely NIP-96 upload server selection."
    content:
      type: empty
    tags:
      -
        name: server
        next:
          type: url
          required: true

  10166:
    description: Relay Monitor Announcement
    summary: "NIP-66 event announces that author publishes periodic relay-monitor results (kind 30166). Tags include `frequency`, optional `timeout` and checks `c`, plus optional geohash."
    content:
      type: empty
    tags: []

  10312:
    description: Room Presence
    summary: "Presence announcement for an ephemeral/real-time room; schema has empty content and no tags, so room identity/expiry may be supplied by event timing or an external application protocol."
    content:
      type: empty
    tags: []

  10317:
    description: User Grasp List
    summary: "Replaceable “grasp” relay list according to schema: `g` tags carry relay URLs. Purpose and “grasp” term are not explained by schema; could be discovery/relay reachability metadata."
    content:
      type: empty
    tags:
      -
        name: "g"
        next:
          type: relay
          required: true

  10377:
    description: Proxy Announcement
    summary: "Replaceable proxy/service announcement; schema has no tags or content constraints. Likely declares a proxy endpoint or service identity, but payload is not specified here."
    content:
      type: empty
    tags: []

  11111:
    description: Transport Method Announcement
    summary: "Replaceable announcement of supported transport methods; current schema gives no fields. Likely application-level capability negotiation for Nostr transport/proxy features."
    content:
      type: empty
    tags: []

  13194:
    description: Wallet Info
    summary: "NIP-47 wallet service information response/announcement, describing capabilities supported by connected Lightning wallet. Used during Nostr Wallet Connect setup; exact content fields are NIP-47-defined."
    in_use: true
    content:
      type: free
    tags: []

  13303:
    description: Concord Invite List
    summary: "Replaceable, self-encrypted creator-side list of Concord invite links. NIP-44-encrypted JSON content stores link tokens, signer secrets, Community IDs, URLs, labels and tombstones; no tags."
    in_use: true
    content:
      type: free
    tags: []

  17375:
    description: Cashu Wallet Event
    summary: "NIP-60 encrypted replaceable wallet state event. Holds wallet configuration and mint/proof state in NIP-44 encrypted content; used as user’s recoverable Cashu wallet data on relays."
    in_use: true
    content:
      type: free
    tags: []

  21000:
    description: Lightning Pub RPC
    summary: "Schema calls this “Lightning Pub RPC”, with free-form content and no tags. Likely a remote procedure call/public notification related to Lightning; neither request grammar nor reply kind appears here."
    content:
      type: free
    tags: []

  22242:
    description: Client Authentication
    summary: "NIP-42 ephemeral client AUTH event signed to a relay challenge. `relay` tag identifies relay; `challenge` copies challenge string. Relay uses it to authenticate connection, not as ordinary feed content."
    in_use: true
    content:
      type: free
    tags:
      - *relaytag
      - name: challenge
        next:
          type: free
          required: true

  23194:
    description: Wallet Request
    summary: "NIP-47 encrypted Nostr Wallet Connect request from client to wallet service. Contains RPC request (e.g. `pay_invoice`, `get_balance`) and is encrypted with shared connection secret; published to NWC relay(s)."
    content:
      type: free
    tags: []

  23195:
    description: Wallet Response
    summary: "NIP-47 encrypted wallet-service response to kind-23194 request. Carries RPC result/error and request correlation tag; response is encrypted with connection key and returned over configured relays."
    content:
      type: free
    tags: []

  24133:
    description: Nostr Connect
    summary: "NIP-46 remote-signer request/response event. Clients and signers exchange encrypted RPC commands over relays; connection URI establishes signer key, relays and secret."
    content:
      type: free
    tags: []

  24242:
    description: Blobs stored on mediaservers
    summary: "Schema labels kind as media-server blob record; free-form content, no tags. Potential link to Blossom/NIP-96 media uploads, but no standardized payload represented here."
    content:
      type: free
    tags: []

  30008:
    description: Profile Badges
    summary: "NIP-58 addressable badge set/profile-badge event. Contains ordered `a` badge-definition and `e` badge-award pairs; allows users to accept/reject and order displayed badges."
    in_use: true
    content:
      type: empty
    multiple:
      - a
      - e
    tags:
      - *atag
      - *etag

  30009:
    description: Badge Definition
    summary: "NIP-58 addressable event defines a badge. `d` uniquely identifies issuer’s badge; `name`, `description`, `image`, and thumbnails describe it. Award events kind 8 reference its coordinate."
    in_use: true
    content:
      type: free
    tags:
      -
        name: name
        next:
          type: free
          required: true
      - *descriptiontag
      - *imagetag
      -
        name: thumb
        next:
          type: url
          next:
            type: free

  30017:
    description: Create or Update a Stall
    summary: "NIP-15 marketplace addressable event defining merchant/stall metadata and configuration. Content is JSON; products (kind 30018) and purchase flows refer to stall coordinates."
    content:
      type: json
    tags: []

  30018:
    description: Create or Update a Product
    summary: "NIP-15 marketplace addressable product listing, JSON content describes product, pricing, inventory and shipping; coordinate identifies versioned listing. Products belong to kind-30017 stalls."
    content:
      type: json
    tags: []

  30020:
    description: Product Sold as an Auction
    summary: "Marketplace auction listing. Schema says JSON content; NIP-15 defines auction-style product sale with bids and confirmation events."
    content:
      type: json
    tags: []

  30023:
    description: Long-form Content
    summary: "NIP-23 addressable long-form article. `d` identifier defines article coordinate; content is Markdown; title, summary, image, publication time, and `a/q/p` references support feeds and citations. Replies use NIP-22 kind 1111."
    in_use: true
    content:
      type: free
    multiple:
      - q
      - a
      - p
    tags:
      - *titletag
      - *imagetag
      - *summarytag
      - *publishedattag
      - *qtag
      - *atag
      - *ptag

  30024:
    description: Draft Long-form Content
    summary: "Addressable private/local draft form of NIP-23 article; same metadata/reference shape as kind 30023, but intended as draft rather than published content. Clients may encrypt drafts and restrict relay access."
    content:
      type: free
    multiple:
      - q
      - a
      - p
    tags:
      - *titletag
      - *imagetag
      - *summarytag
      - *publishedattag
      - *qtag
      - *atag
      - *ptag

  35128:
    description: Named Nsite
    summary: "NIP-5A named-site manifest: addressable event requiring `d` identifier (canonical URL IDs are 1–13 lowercase alphanumeric/hyphen characters, not ending in `-`). Uses same absolute `path`→SHA-256 mapping as root kind 15128; `x` aggregate is recommended, while server/title/description/source/icon/app links are optional. `d` names subsite within author namespace."
    in_use: true
    content:
      type: empty
    multiple:
      - path
      - server
    required:
      - path
    tags:
      - *pathtag
      - *servertag
      - *titletag
      - *descriptiontag
      - *sourcetag

  35130:
    description: Web Napp
    summary: "Addressable manifest for a web app: a static site of HTML, CSS and JavaScript that a Nostr app launcher runs in a sandboxed iframe. `path` tags identify the site's files; `action`, `requires`, `mode` (`normal`/`auxiliary`/`headless`), initial size, singleton and icon describe its capabilities and presentation. Kind 35131 identifies a WASM napp instead."
    in_use: true
    content:
      type: empty
    required:
      - path
    multiple:
      - path
      - server
      - action
      - requires
      - mode
    tags:
      - *pathtag
      - *servertag
      - *titletag
      - *descriptiontag
      - name: action
        next:
          type: free
          required: true
      - name: requires
        next:
          type: free
          required: true
      - name: mode
        next:
          type: constrained
          either:
            - normal
            - auxiliary
            - headless
          required: true
      - name: initial_size
        next:
          type: free
          required: true
          next:
            type: free
            required: true
      - name: singleton
      - name: icon
        next:
          type: free

  35131:
    description: Wasm Napp
    summary: "Addressable manifest for a WASM app: one `app.wasm` module, run by a Nostr app launcher with a canvas and no DOM, iframe or JavaScript. Uses the same manifest tags as web napp kind 35130; `path` tags identify the module and any accompanying files."
    in_use: true
    content:
      type: empty
    required:
      - path
    multiple:
      - path
      - server
      - action
      - requires
      - mode
    tags:
      - *pathtag
      - *servertag
      - *titletag
      - *descriptiontag
      - name: action
        next:
          type: free
          required: true
      - name: requires
        next:
          type: free
          required: true
      - name: mode
        next:
          type: constrained
          either:
            - normal
            - auxiliary
            - headless
          required: true
      - name: initial_size
        next:
          type: free
          required: true
          next:
            type: free
            required: true
      - name: singleton
      - name: icon
        next:
          type: free

  30078:
    description: Application-specific Data
    summary: "NIP-78 addressable app-specific data record. `d` identifier selects per-app record; content is app-defined. NIP-78 recommends encryption/authentication for private user data and relays should only serve owner’s events."
    in_use: true
    content:
      type: free
    tags: []

  30315:
    description: User Statuses
    summary: "NIP-38 addressable user status. Content is status text; optional `r/e/a/p` tags attach URL/event/address/person; emoji tags support status emoji. `d` commonly indicates status type (e.g. general/music/reading) per NIP-38."
    content:
      type: free
    tags:
      - *rtag
      - *ptag
      - *etag
      - *atag
      - *emojitag

  30402:
    description: Classified Listing
    summary: "NIP-99 addressable marketplace classified ad. Content is description; title, summary, price/currency, location, status, image, geohash and references structure listing."
    content:
      type: free
    tags:
      - *titletag
      - *summarytag
      - *publishedattag
      -
        name: location
        next:
          type: free
          required: true
      -
        name: price
        next:
          type: free
          required: true
          next:
            type: free
            required: true
            next:
              type: free
      -
        name: status
        next:
          type: constrained
          either:
           - active
           - sold
      - *imagetag
      -
        name: g
        next:
          type: free
      - *etag
      - *atag

  30403:
    description: Draft Classified Listing
    summary: "Draft of NIP-99 classified listing; same metadata family as kind 30402, used before publishing. Schema includes title/summary/price/location/status/images and event/address references."
    content:
      type: free
    tags:
      - *titletag
      - *summarytag
      - *publishedattag
      -
        name: location
        next:
          type: free
          required: true
      -
        name: price
        next:
          type: free
          required: true
          next:
            type: free
            required: true
            next:
              type: free
      -
        name: status
        next:
          type: constrained
          either:
           - active
           - sold
      - *imagetag
      - *gtag
      - *etag
      - *atag

  30404:
    description: Want-to-buy Listing
    content:
      type: free
    tags:
      -
        name: d
        next:
          type: free
          required: true
      - *titletag
      - *summarytag
      - *publishedattag
      -
        name: price
        next:
          type: free
          required: true
          next:
            type: free
            required: true
            next:
              type: free
      -
        name: status
        next:
          type: constrained
          either:
           - active
           - awarded
           - fulfilled
           - cancelled
      -
        name: t
        next:
          type: free
          required: true
      -
        name: m
        next:
          type: free
      - *imagetag
      -
        name: expiration
        next:
          type: free
      -
        name: alt
        next:
          type: free
          required: true
      -
        name: nenya
        next:
          type: constrained
          either:
           - "1"

  31922:
    description: Date-Based Calendar Event
    summary: "NIP-52 addressable all-day/date calendar event. `start`/`end` are dates; title/location required in this schema; tags can include description/image/geohash/participants and calendar address."
    in_use: true
    content:
      type: free
    required:
      - title
      - start
      - location
    multiple:
      - p
      - g
    tags:
      - *titletag
      - *summarytag
      - *imagetag
      -
        name: location
        next:
          type: free
          required: true
      - *gtag
      - *ptag
      -
        name: start
        next:
          type: date
          required: true
      -
        name: end
        next:
          type: date
          required: true

  31923:
    description: Time-Based Calendar Event
    summary: "NIP-52 addressable timed calendar event. `start`/`end` are timestamps; timezone IDs preserve civil-time intent; title/location and optional summary/image/geohash/participants describe event."
    in_use: true
    content:
      type: free
    multiple:
      - p
      - g
    required:
      - title
      - start
      - location
    tags:
      - *titletag
      - *summarytag
      - *imagetag
      -
        name: location
        next:
          type: free
      - *gtag
      - *ptag
      -
        name: start
        next:
          type: timestamp
          required: true
      -
        name: end
        next:
          type: timestamp
          required: true
      -
        name: start_tzid
        next:
          type: free
          required: true
      -
        name: end_tzid
        next:
          type: free
          required: true
  31924:
    description: Calendar
    summary: "NIP-52 addressable calendar collection. Title and metadata describe calendar; repeated `a` tags include date- or time-based calendar events."
    in_use: true
    content:
      type: free
    required:
      - title
    multiple:
      - a
    tags:
      - *titletag
      - *atag
      - *imagetag
      - *descriptiontag

  31925:
    description: Calendar Event RSVP
    summary: "NIP-52 replaceable RSVP to calendar event. `a` identifies calendar event; `status` is accepted/declined/tentative; optional `fb` indicates free/busy and `p` tags attendees."
    in_use: true
    content:
      type: free
    required:
      - a
      - status
    tags:
      - *etag
      - *atag
      -
        name: status
        next:
          type: constrained
          either:
            - accepted
            - declined
            - tentative
          required: true
      -
        name: fb
        next:
          type: constrained
          either:
            - free
            - busy
      - *ptag

  31989:
    description: Handler Recommendation
    summary: "NIP-89 handler recommendation event. References addressable application handler (`a`) clients should use for a kind/content type; allows authors to recommend preferred apps/handlers."
    content:
      type: empty
    tags:
      - *atag

  31990:
    description: Handler Information
    summary: "NIP-89 addressable handler metadata announcement. Describes application handler for one or more kinds, web URI templates and platform-specific links; discovery data lets clients route unsupported events to external apps."
    content:
      type: json
    tags:
      - *ktag
      -
        name: web
        next:
          type: url
          required: true
          next:
            type: constrained
            either:
             - nevent
             - nprofile
      -
        name: ios
        next:
          type: free
          required: true

  31992:
    description: Slash Command Definition
    summary: "NIP-CD addressable command manifest. Schema defines command trigger/name/description, typed positional arguments and scope filters (`s`) limiting which events trigger the command. Invocations are plain text at index 0 of any event content with no tags."
    content:
      type: empty
    required:
      - command
      - title
      - description
    multiple:
      - arg
      - s
    tags:
      -
        name: command
        next:
          type: free
          required: true
        description: trigger without a leading slash
      - *titletag
      - *descriptiontag
      -
        name: arg
        next:
          type: free
          required: true
          next:
            type: constrained
            either:
              - pubkey
              - event
              - address
              - relay
              - number
              - bool
              - enum
              - word
              - text
            required: true
            next:
              type: constrained
              either:
                - required
                - optional
              required: true
              next:
                type: free
                next:
                  type: free
                  variadic: true
        description: '["arg", <name>, <type>, "required" | "optional", <label>, <choice>...], choices apply to type enum only; arguments are positional, optional/text arguments come after required ones, at most one of either'
      -
        name: s
        next:
          type: free
          required: true
        description: 'scope, one of kind:<kind>, relay:<url>, author:<pubkey>, tag:<tag> (non-empty tag required) or tag:<tag>:<value>; same-type scopes are alternatives, different types must all match, absent type is unrestricted'

  30617:
    description: Git Repository Announcement
    summary: "NIP-34 addressable Git repository announcement. `d` is repo identifier; `clone` URLs locate Git repository, `web` links homepage, `r` declares default branch hash, maintainers/relays/topics describe repo."
    in_use: true
    content:
      type: empty
    multiple:
      - web
      - clone
    required:
      - clone
    tags:
      -
        name: name
        next:
          type: free
          required: true
      - *descriptiontag
      -
        name: web
        next:
          type: url
          required: true
      -
        name: clone
        next:
          type: giturl
          required: true
      -
        name: relays
        next:
          type: relay
          variadic: true
      -
        name: r
        next:
          type: hex
          min: 40
          max: 40
          required: true
          next:
            type: constrained
            either:
             - euc
            required: true
      -
        name: maintainers
        next:
          type: pubkey
          variadic: true
      -
        name: t

  30618:
    description: Git Repository State Announcement
    summary: "NIP-34 addressable snapshot of repository refs and HEAD. `refs/<name>` tags map branch/tag refs to commit hashes; `HEAD` names current default reference."
    in_use: true
    content:
      type: empty
    multiple:
      - "refs/"
    required:
      - HEAD
    tags:
      -
        prefix: "refs/"
        next:
          type: hex
          min: 40
          max: 40
          required: true
      -
        name: HEAD
        next:
          type: free

  1617:
    description: Git Patch
    summary: "NIP-34 patch event carries Git-format patch/commit information in content. Required repo address and `t` root/root-revision role link patch to project; commit, parent, committer and signature tags capture Git provenance."
    in_use: true
    content:
      type: free
    required:
      - t
      - a
      - p
    tags:
      - *atag
      -
        name: r
        next:
          type: hex
          min: 40
          max: 40
          required: true
      - *ptag
      -
        name: t
        next:
          type: constrained
          either:
           - root
           - root-revision
          required: true
      -
        name: commit
        next:
          type: hex
          min: 40
          max: 40
          required: true
      -
        name: parent-commit
        next:
          type: hex
          min: 40
          max: 40
          required: true
      -
        name: commit-pgp-sig
        next:
          type: free
          required: true
      -
        name: committer
        next:
          type: free
          required: true
          next:
            type: free
            required: true
            next:
              type: free
              required: true
              next:
                type: free
                required: true

  1618:
    description: Git Pull Request
    summary: "NIP-34 Git pull request event. References repo coordinate, subject/branch, branch tip commit, clone URLs and merge base; optional `e` links related events."
    in_use: true
    content:
      type: free
    required:
      - a
      - subject
      - clone
      - c
    tags:
      - *atag
      - *ptag
      -
        name: r
        next:
          type: hex
          min: 40
          max: 40
          required: true
        description: earliest commit id of repo, so clients can subscribe to all PRs sent to a local git repo
      -
        name: subject
        next:
          type: free
          required: true
      -
        name: branch-name
        next:
          type: free
          required: true
      -
        name: c
        next:
          type: hex
          min: 40
          max: 40
          required: true
        description: tip of the PR branch
      -
        name: clone
        next:
          type: giturl
          required: true
          variadic: true
        description: at least one git clone url where commit can be downloaded
      - *etag
      -
        name: merge-base
        next:
          type: hex
          min: 40
          max: 40
          required: true
