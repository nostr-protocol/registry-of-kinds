  11801:
    description: Mesh Node Descriptor
    content:
      type: free
    multiple:
      - key
      - endpoint
      - mediator
      - c
    required:
      - class
      - protocol
      - c
      - expiration
    tags:
      - name: class
        next:
          type: constrained
          either:
            - leaf
            - edge
            - anchor
          required: true
        description: what the node can be relied on for
      - name: protocol
        next:
          type: free
          required: true
          next:
            type: hex
            required: true
        description: protocol version name, then the digest of its machine-readable schema
      - name: software
        next:
          type: url
          next:
            type: free
      - name: key
        next:
          type: constrained
          either:
            - agreement
            - transport
          required: true
          next:
            type: free
            required: true
            next:
              type: timestamp
        description: multibase-encoded key bound to this node, with optional expiry
      - name: endpoint
        next:
          type: free
          required: true
          next:
            type: free
            required: true
            next:
              type: free
        description: transport name, address, then a preference value, low first
      - name: mediator
        next:
          type: free
          required: true
        description: DID of a node that holds messages for this one
      - name: c
        next:
          type: free
          required: true
        description: one capability actually installed, not merely supported; repeated, and single-letter so relays index it. A meshstr protocol identifier as the value declares the node implements that protocol; peering/1.0 and budget/1.0 are required of every class
      - name: nips
        next:
          type: free
          required: true
      - name: coverage
        next:
          type: hex
          required: true
        description: digest of this node's coverage claim set
      - name: policy
        next:
          type: hex
          required: true
          next:
            type: url
        description: digest of the operator's policy document, and where to read it
      - name: operator
        next:
          type: pubkey
          required: true
      - name: nonce
        next:
          type: free
          required: true
          next:
            type: free
            required: true
        description: NIP-13 proof of work, nonce then target difficulty
      - name: expiration
        next:
          type: timestamp
          required: true

  11802:
    description: Mesh Node Revocation
    content:
