  8828:
    description: Timeline Act
    summary: "Replaceable timeline curation/decision event for kind-30828 card. `e` marks exact card version accepted/revoked/superseded; optional `a` identifies card coordinate; copied title/summary put fields in scope. Acts preserve provenance and revision history."
    in_use: true
    content:
      type: free
      # byte-exact copy of the accepted card version's content when content is in scope, else empty or a revoke reason
    required:
      - e
    multiple:
      - e
    tags:
      -
        name: a
        next:
          type: addr
          required: true
        description: the accepted card (kind 30828 coordinate); absent on a revoke
      -
        name: e
        next:
          type: id
          required: true
          next:
            type: free
            next:
              type: constrained
              either:
                - supersede
                - revoke
        description: unmarked = the exact card version accepted; supersede = the signer's prior act this one replaces; revoke = the signer's act withdrawn
      - *ptag
      -
        name: title
        next:
          type: free
          required: true
        description: byte-exact copy of the accepted version's title; presence puts title in scope
      -
        name: summary
        next:
          type: free
          required: true
        description: byte-exact copy of the accepted version's summary; presence puts summary in scope

