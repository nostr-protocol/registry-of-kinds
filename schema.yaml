    type: relay
    next:
      type: free  # petname

_external: &external
  type: free
  required: true
  next:
    type: url

_event: &event
  type: id
  required: true
  next:
    type: relay
    next:
      type: pubkey

_addr: &addr
  type: addr
  required: true
  next:
    type: relay

_kind: &kind
