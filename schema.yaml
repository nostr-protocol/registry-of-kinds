  30810:
    description: Mesh Compute Ask
    content:
      type: empty
    required:
      - d
      - commit
      - executor
      - bid
      - deadline
      - fuel_max
      - verify
      - expiration
    tags:
      - name: d
        next:
          type: free
          required: true
      - name: commit
        next:
          type: hex
          required: true
        description: commitment to the job specification, which is not published; the module and input reach only the seller that wins the quote
      - name: executor
        next:
          type: constrained
          either:
            - wasm
            - bacalhau
          required: true
      - name: runtime
        next:
          type: free
          required: true
          next:
            type: free
            next:
              type: hex
        description: engine, version, and the digest of its capability profile; quotes are never compared across engines
      - name: bid
        next:
          type: free
          required: true
          next:
            type: free
            required: true
        description: price unit, then price
      - name: deadline
        next:
          type: timestamp
          required: true
      - name: fuel_max
        next:
          type: free
          required: true
        description: the ceiling the buyer will pay for, and what a quote is priced against
      - name: input_size
        next:
          type: free
          required: true
        description: input length in bytes, so work can be priced without being described
      - name: verify
        next:
          type: constrained
          either:
            - sample
            - dual
            - proof
            - none
          required: true
          next:
            type: free
        description: verification mode, declared before the work, which fixes what evidence a dispute admits; the second element parameterises it
      - name: expiration
        next:
          type: timestamp
          required: true

